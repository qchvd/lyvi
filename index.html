<!doctype html>
<html lang="fr">

<head>
    <!-- Google consent mode: must run before GTM. Everything is denied until the visitor accepts the cookie banner;
         a previous choice (cookie "lyviCookieConsent2", set by the banner) is applied right away.
         The banner covers audience measurement and Google Ads conversions: accepting grants both.
         (Cookie renamed from "lyviCookieConsent" when ads were added: earlier consents did not cover ads.) -->
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    var lyviConsent = /(?:^|; )lyviCookieConsent2=true(?:;|$)/.test(document.cookie) ? 'granted' : 'denied';
    gtag('consent', 'default', {
        analytics_storage: lyviConsent,
        ad_storage: lyviConsent,
        ad_user_data: lyviConsent,
        ad_personalization: lyviConsent
    });
    </script>
    <!-- Google Tag Manager. Not loaded during the prerender (Puppeteer sets navigator.webdriver):
         otherwise the scripts GTM injects are baked into the static pages (GTM then loads twice)
         and every build sends fake visits to Google. -->
    <script>if (!navigator.webdriver) (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5PHH5488');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/lyviFavicon.svg" />
    <link rel="preload" href="/fonts/figtree-v9-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/figtree-v9-latin-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/figtree-v9-latin-800.woff2" as="font" type="font/woff2" crossorigin>
    <title>Lyvi</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
