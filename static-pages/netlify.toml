# =======================================================
# Toute autre adresse : page 404 de la langue, avec un vrai statut 404
# (pas de redirection : les anciennes URL comme /fr/soins, /en/faq ou /de/faq n'existent plus ;
#  seule exception : /fr/faq, redirigée plus haut)
# =======================================================

[[redirects]]
  from = "/fr/*"
  to = "/fr-404/index.html"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en-404/index.html"
  status = 404

[[redirects]]
