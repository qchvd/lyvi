# Installs Chrome for the prerender first (does nothing if it is already in the cache:
# see .puppeteerrc.cjs). Without it, a build using cached node_modules fails with
# "Could not find Chrome". Overrides the build command set in the Netlify app.
[build]
  command = "npx puppeteer browsers install chrome && npm run prerender"

[build.processing]
  skip_processing = true

# =======================================================
# Domaine Netlify -> domaine principal
# =======================================================

[[redirects]]
  from = "https://lyvicare.netlify.app/*"
  to = "https://lyvicare.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://lyvicare.netlify.app/*"
  to = "https://lyvicare.com/:splat"
  status = 301
  force = true

# =======================================================
# Racine "/" : choix de la langue du navigateur
# =======================================================

[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  conditions = {Language = ["fr"]}

[[redirects]]
  from = "/"
  to = "/de"
  status = 302
  conditions = {Language = ["de"]}

[[redirects]]
  from = "/"
  to = "/en"
  status = 302

# =======================================================
# Fichiers techniques du pré-rendu (fr-a-propos/, fr/index.html, fr-404/...) :
# jamais accessibles directement, pour éviter les doublons d'URL.
# Placés avant les pages : Netlify applique la première règle qui correspond,
# et une réécriture (200) ne repasse pas par les règles.
# =======================================================

# Formulaire caché pour la détection du formulaire de contact par Netlify (lu au déploiement) :
